services:
  # The Load Balancer (The Front Door)
  proxy:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dashboard
    restart: always

  # The Dashboard Cluster (The Workers)
  dashboard:
    build: .
    restart: always
    deploy:
      replicas: 2
